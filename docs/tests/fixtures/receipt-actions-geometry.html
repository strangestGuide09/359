<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../style.css"><title>Receipt actions geometry</title></head>
<body><main data-layout="dashboard"><section class="dashboard-shell"><section class="panel expenses-panel"><div class="heading"><div><p>LEDGER</p><h2>Recent expenses</h2></div><span>2 saved</span></div>
  <div class="ledger-columns" aria-hidden="true"><span>Merchant</span><span>Paid by</span><span>Date</span><span>Reviewed items</span><span>Amount</span><span>Actions</span></div>
  <div class="expense purchase-row" data-purchase-id="purchase-1"><div class="purchase-merchant"><b>Instamart</b><span>Groceries</span></div><span data-label="Paid by">Ritesh</span><time data-label="Date">9 Aug 2026</time><span data-label="Items">11 reviewed</span><div class="purchase-amount" data-label="Amount"><b>₹2,360.04</b></div><div class="receipt-action-buttons" data-label="Actions" role="group" aria-label="Receipt actions for Instamart"><button type="button" class="receipt-edit"><span>Edit</span></button><button type="button" class="receipt-delete"><span>Remove</span></button></div></div>
  <div class="expense purchase-row" data-purchase-id="purchase-2"><div class="purchase-merchant"><b>Corner shop with a longer merchant name</b><span>Groceries</span></div><span data-label="Paid by">Ekta</span><time data-label="Date">8 Aug 2026</time><span data-label="Items">Manual entry</span><div class="purchase-amount" data-label="Amount"><b>₹125.00</b></div><div class="receipt-action-buttons" data-label="Actions" role="group" aria-label="Receipt actions for Corner shop"><button type="button" class="receipt-edit"><span>Edit</span></button><button type="button" class="receipt-delete"><span>Remove</span></button></div></div>
</section></section></main></body></html>
