<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../style.css?geometry=concept-2"><title>Geometry fixture</title></head><body><main data-layout="narrow"><header><a class="brand"><b>GL</b> Grocery Ledger</a><span>Synced</span></header><div id="screen"></div><div class="page-meta"><p id="status"></p><footer>Reviewed shared-ledger entries only · PDFs are processed locally · no payment method, address, card, or UPI details</footer></div></main><dialog id="fixture-dialog"><form><div class="heading"><div><p>NEW ENTRY</p><h2>Add expense</h2></div><button type="button">×</button></div><p class="dialog-help"></p><label>Merchant<input value="Instamart"></label><div class="two expense-meta-grid"><label for="fixture-category">Category<select id="fixture-category"><option>Groceries</option></select></label><div class="field-with-help"><label for="fixture-payer">Paid by</label><select id="fixture-payer"><option>Ritesh (you · Owner) with a deliberately long member label</option></select><small>Choose who actually paid, even if the other member uploads the bill.</small></div></div><menu><button type="button" class="secondary">Cancel</button><button type="submit">Save</button></menu></form></dialog><script>
const params=new URLSearchParams(location.search),state=params.get("state")||"loading",presentation=params.get("presentation")==="sketch"?"sketch":"classic";document.documentElement.dataset.presentation=presentation;const main=document.querySelector("main"),screen=document.querySelector("#screen");
const members='<div class="member-blocks"><span class="member-block"><strong>Ritesh</strong><span>·</span><span>owner</span><span>·</span><small class="you-badge">you</small></span><span class="member-block"><strong>Ekta</strong><span>·</span><span>partner</span></span></div>';
const settings=`<details id="household-settings" class="panel settings"${state==="settings"?" open":""}><summary><span><b>Household settings</b><small>Recovery, members and account</small></span><span>Open</span></summary><div class="settings-body"><section class="settings-recovery"><div class="settings-section-heading"><b>Receipt recovery</b><small>Restore removed ledger entries.</small></div><div class="archive-list"><div class="expense archived-entry"><div><b>Removed receipt: Instamart</b><span>₹229 · removed recently</span></div><div class="archived-entry-actions"><button class="secondary">Restore to ledger</button><button class="archive-purge">Delete permanently</button></div></div></div></section><div class="settings-columns"><section class="settings-profile"><div class="settings-section-heading"><b>Household members</b><small>Two people share this ledger.</small></div><div class="member-list"><div class="expense"><div><b>Ritesh</b><span>Owner · you</span></div></div><div class="expense"><div><b>Ekta</b><span>Partner</span></div></div></div><form class="inline-form"><label>Your display name<input value="Ritesh"></label><button class="secondary">Update name</button></form></section><section class="settings-account"><section class="account-session"><div><b>Account and session</b><small>Sign out on this browser.</small></div><button class="secondary session-sign-out">Sign out</button></section></section></div><div class="danger-zone"><b>Close household</b><small>Starts a 30-day recovery period.</small><button class="danger">Close household</button></div></div></details>`;
if(state==="loading"||state==="auth"){main.dataset.layout="narrow";screen.innerHTML=`<section class="panel ${state==="loading"?"state-panel":"account-gate"}"><p>${state==="loading"?"PLEASE WAIT":"WELCOME"}</p><h1>${state==="loading"?"Opening Grocery Ledger":"Grocery Ledger"}</h1><article>${state==="loading"?"Syncing reviewed expenses and items…":"Sign in to your existing account."}</article></section>`}else{main.dataset.layout="dashboard";screen.innerHTML=`<section class="dashboard-shell"><section class="household-masthead"><div class="household-title"><p>HOUSEHOLD</p><h1>All in 359</h1></div>${members}</section><section class="rhythm-week"><div class="section-heading rhythm-heading"><div><p>HOUSEHOLD TIMELINE</p><h2>Household rhythm</h2></div><span>3 Jul – 16 Aug 2026</span></div><div class="rhythm-navigation"><button class="secondary">Previous</button><span class="selected-purchase-date">Selected date <b>13 Aug 2026</b></span><button class="secondary">Next</button><span class="latest-marker">Today selected</span></div><p class="rhythm-explainer">Past cards use receipt purchase dates. Today and upcoming days show the household rhythm without changing receipt chronology.</p><ol class="week-strip purchase-date-strip is-compact"><li class="week-day"><small class="date-gap">40 quiet days</small><button><time><span>Fri, Jul</span><b>3</b></time><small>1 receipt</small></button></li><li class="week-day is-selected is-today"><small class="date-gap">40 quiet days</small><button><time><span>Today</span><b>13</b></time><small>1 receipt</small></button></li><li class="week-day is-future"><small class="date-gap"></small><button><time><span>Tomorrow</span><b>14</b></time><small class="quiet">Upcoming</small></button></li><li class="week-day is-future"><small class="date-gap"></small><button><time><span>Sat, Aug</span><b>15</b></time><small class="quiet">Upcoming</small></button></li><li class="week-day is-future"><small class="date-gap"></small><button><time><span>Sun, Aug</span><b>16</b></time><small class="quiet">Upcoming</small></button></li></ol></section><section class="rhythm-focus-grid"><section class="command-bar rhythm-money"><section class="balance-card"><div class="balance-summary"><small>Current balance</small><strong>You owe Ekta ₹470.50</strong><span>Shared items split equally</span></div><div class="balance-next"><span><b>Next action</b>Send ₹470.50 to Ekta, then record it here.</span><button id="settle">Record payment</button></div></section><nav class="command-actions primary-actions"><button>Import receipt</button><button class="secondary">Add expense</button><button class="settings-action">Household settings</button></nav></section><section class="panel rhythm-shopping"><div class="heading"><div><p>SHOPPING NEXT</p><h2>Possible buys</h2></div></div><p class="empty-state">Track an item on another purchase date.</p></section></section><section class="panel household-record"><div class="heading"><div><p>CHRONOLOGY</p><h2>Household record</h2></div></div><div class="expense"><div><b>Blinkit</b><span>Purchased 13 Aug 2026</span></div><b>₹603</b></div><div class="expense"><div><b>Instamart</b><span>Purchased 3 Jul 2026 · Uploaded 13 Aug 2026</span></div><b>₹727</b></div></section>${settings}</section>`}
if(params.get("notice")==="1")document.querySelector(".command-bar")?.insertAdjacentHTML("beforeend",'<div class="import-feedback duplicate" role="status"><span>This receipt was already imported. No new expense was added.</span><button class="plain feedback-dismiss">×</button></div>');
if(params.has("review")){
  const computed=params.get("review")==="computed",fixtureDialog=document.querySelector("#fixture-dialog"),fixtureForm=fixtureDialog.querySelector("form"),reviewRows=[["Akshayakalpa Organic Artisanal Organic Set Cup Curd (Cup)","80.00"],["Akshayakalpa Organic Malai Paneer (Pack)","145.00"],["Everyday Apple (Pack)","100.00"]];fixtureDialog.classList.add("pdf-review-dialog");fixtureDialog.querySelector(".heading p").textContent="LOCAL PDF DRAFT";fixtureDialog.querySelector("h2").textContent="Review PDF import";fixtureDialog.querySelector(".dialog-help").textContent=computed?"Receipt total was calculated from the labelled Total column across complete item rows. Verify it against the invoice before saving.":"We could not confidently identify a final paid or payable total. Enter it from the receipt, then verify every item and charge before saving.";fixtureDialog.querySelector(".dialog-help").classList.toggle("parser-warning",!computed);const rows=reviewRows.map(([name,total],index)=>`<fieldset class="item-row"><legend>Item ${index+1}</legend><div class="item-primary"><label class="item-name">Item name<input value="${name}"></label><label>Qty<input value="1"></label><label>Line total (₹)<input value="${total}"></label></div><div class="item-flags"><label class="check"><input type="checkbox"> Personal</label><label class="check"><input type="checkbox" checked> Track for restock</label><details class="item-details"><summary>More details</summary></details></div></fieldset>`).join("");const totals=computed?"Reviewed items: ₹2,360.04 · Receipt total: ₹2,360.04 · Totals match":"Reviewed items: ₹325.00 · Receipt total: needs confirmation · Difference unavailable";fixtureForm.querySelector("menu").insertAdjacentHTML("beforebegin",`<div id="pdf-items"><div class="heading item-heading"><div><p>REVIEWED ITEMS</p><h3>Check every purchased item</h3></div><button type="button" class="secondary">+ Add item</button></div><p class="dialog-help">Edit or remove anything the local parser got wrong. Only these reviewed fields will sync.</p><div id="item-rows">${rows}</div><div class="item-total">${totals}</div></div><div class="two"><label>Amount (₹)<input ${computed?'value="2360.04"':'placeholder="Enter payable total"'}></label><label>Date<input type="date" value="2026-07-22"></label></div>`);fixtureForm.querySelector('button[type="submit"]').textContent="Save receipt";
}
if(params.get("modal")==="1")document.querySelector("#fixture-dialog").showModal();
</script><script type="module">
import { householdRhythmTimeline } from "../../purchase-timeline.js";
import { renderBalanceSummary, renderCommandActions, renderHouseholdRhythm } from "../../home-rhythm-view.js";
if (!['loading','auth'].includes(new URLSearchParams(location.search).get('state') || 'loading')) {
  const fmt=value=>new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(new Date(`${value}T12:00:00`));
  const purchases=[{purchased_on:'2026-07-03',created_at:'2026-08-13T09:00:00Z'},{purchased_on:'2026-08-13',created_at:'2026-08-13T10:00:00Z'}];
  const timeline=householdRhythmTimeline(purchases,'2026-08-13');
  document.querySelector('.rhythm-week').outerHTML=renderHouseholdRhythm(timeline,fmt);
  document.querySelector('.balance-card').outerHTML=renderBalanceSummary({balanceText:'You owe Ekta ₹470.50',guidance:'Send ₹470.50 to Ekta, then record it here.',actionLabel:'Record payment sent',actionAmount:'₹470.50'});
  document.querySelector('.command-actions').outerHTML=renderCommandActions(false);
  document.documentElement.dataset.productionHomeRender='true';
}
</script></body></html>
