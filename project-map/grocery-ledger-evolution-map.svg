<text x="65" y="150" class="t P">01 · INTENT</text><text x="65" y="360" class="t P">02 · FOUNDATION</text><text x="65" y="635" class="t P">03 · EVOLUTION</text><text x="65" y="915" class="t P">04 · CHOICES</text><text x="65" y="1190" class="t P">05 · NOW / NEXT</text>
<path d="M157 180H195" class="ln" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="195" y="126" width="410" height="145" rx="20" class="r"/><rect x="630" y="126" width="425" height="145" rx="20" class="g"/><rect x="1080" y="126" width="455" height="145" rx="20" class="g"/></g>
<text x="220" y="163" class="t H">Private household ledger</text><text x="220" y="193" class="t B">Ritesh + Ekta • Owner + Partner only</text><text x="220" y="218" class="t B">Equal settlement • reviewed purchases</text><text x="220" y="243" class="t N">Low-friction receipts • restock • use-soon help</text>
<text x="655" y="163" class="t H">Two purposeful clients</text><text x="655" y="193" class="t B">docs/ website for Ekta’s laptop</text><text x="655" y="218" class="t B">SwiftUI iPhone app for Ritesh</text><text x="655" y="243" class="t N">Client choice never assigns household role</text>
<text x="1105" y="163" class="t H">Product promise</text><text x="1105" y="193" class="t B">Receipt → editable items → fair ledger</text><text x="1105" y="218" class="t B">Explain suggestions; never invent expiry</text><text x="1105" y="243" class="t N">Private by minimization and review</text>
<path d="M157 390H195" class="ln" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="195" y="315" width="425" height="180" rx="20" class="g"/><rect x="645" y="315" width="425" height="180" rx="20" class="g"/><rect x="1095" y="315" width="440" height="180" rx="20" class="g"/></g>
<text x="220" y="352" class="t H">Architecture adopted</text><text x="220" y="382" class="t B">docs/ static web • GitHub Pages</text><text x="220" y="407" class="t B">SwiftUI + SwiftData native app</text><text x="220" y="432" class="t B">Replacement Supabase DB + Auth</text><text x="220" y="457" class="t B">RLS • guarded RPCs • Realtime</text><text x="220" y="480" class="t N">Database enforces two seats</text>
<text x="670" y="352" class="t H">Auth / email evolution</text><text x="670" y="382" class="t B">Default email limits exposed friction</text><text x="670" y="407" class="t B">Brevo SMTP → activation / IP repair</text><text x="670" y="432" class="t B">Working passwordless magic links</text><text x="670" y="457" class="t N">Next: friendly inactive/expired recovery</text><text x="670" y="480" class="t N">No password system</text>
<text x="1120" y="352" class="t H">Household access adopted</text><text x="1120" y="382" class="t B">Create or join one household</text><text x="1120" y="407" class="t B">Invite links Owner + Partner</text><text x="1120" y="432" class="t B">No household Admin role</text><text x="1120" y="457" class="t N">Separate project access for Ekta rejected</text><text x="1120" y="480" class="t N">App household invite model selected</text>
<path d="M157 665H195" class="ln" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="195" y="535" width="650" height="255" rx="22" class="g"/><rect x="870" y="535" width="665" height="255" rx="22" class="g"/></g>
<text x="220" y="573" class="t H">Receipt processing evolution</text><text x="220" y="605" class="t B">Manual entry → local PDF parsing → editable reviewed draft</text><text x="220" y="633" class="t B">Raw PDFs/text never persist → positioned-table quality fixes</text><rect x="220" y="653" width="600" height="48" rx="12" class="a"/><text x="238" y="683" class="t B">Current: local sanitization + preview + per-upload consent</text><text x="220" y="730" class="t B">Planned: redacted derivative → guarded Edge Function → Sarvam</text><text x="220" y="755" class="t N">Server-held key • reviewed allowed fields persist • exact validation required</text>
<text x="895" y="573" class="t H">Possible Buys / AI evolution</text><text x="895" y="605" class="t B">Two different reviewed dates → basic repeat cue</text><text x="895" y="633" class="t B">Malformed parses / naming exposed evidence gaps</text><rect x="895" y="653" width="615" height="48" rx="12" class="a"/><text x="913" y="683" class="t B">Next: identity + confidence + cadence suggestions</text><text x="895" y="730" class="t B">Possible Buys ≠ Use soon / package expiry</text><text x="895" y="755" class="t N">Sarvam chosen only as privacy-filtered 100-credit trial; 0 used</text>
<path d="M157 945H195" class="ln" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="195" y="830" width="650" height="230" rx="22" class="g"/><rect x="870" y="830" width="665" height="230" rx="22" class="c"/></g>
<text x="220" y="868" class="t H">UX / design evolution</text><text x="220" y="900" class="t B">Marketing dashboard → alignment / form-density iteration</text><text x="220" y="928" class="t B">Classic + Sketch explored → Sketch selected</text><text x="220" y="956" class="t B">Concept 2 selected • Concept 2A dropped</text><text x="220" y="984" class="t B">Household → balance → actions → restock → settlements → ledger</text><text x="220" y="1012" class="t N">Desktop / narrow-width refinement continues</text>
<text x="895" y="868" class="t H">Resolved alternatives</text><rect x="895" y="887" width="290" height="60" rx="12" class="x"/><text x="912" y="913" class="t B">Barcode-first workflow</text><text x="912" y="935" class="t N">not selected; optional aid</text><rect x="1200" y="887" width="310" height="60" rx="12" class="x"/><text x="1217" y="913" class="t B">Generic expiry API</text><text x="1217" y="935" class="t N">rejected as unreliable</text><rect x="895" y="969" width="290" height="60" rx="12" class="d"/><text x="912" y="995" class="t B">Custom server / own SMTP</text><text x="912" y="1017" class="t N">deferred</text><rect x="1200" y="969" width="310" height="60" rx="12" class="x"/><text x="1217" y="995" class="t B">SMS through Airtel</text><text x="1217" y="1017" class="t N">explored, not selected</text>
<rect x="195" y="1085" width="1340" height="70" rx="18" class="p"/><text x="220" y="1114" class="t H W">Privacy boundary</text><text x="220" y="1140" class="t B W">LOCAL ONLY: original receipt/image, OCR, exact receipt/order/payment IDs, card/bank/UPI/QR, address  →  REVIEW GATE  →  reviewed items/totals/flags may sync</text>
<path d="M157 1220H195" class="ln" marker-end="url(#ar)"/><g filter="url(#sh)"><rect x="195" y="1180" width="520" height="170" rx="22" class="g"/><rect x="740" y="1180" width="795" height="170" rx="22" class="a"/></g>
<text x="220" y="1217" class="t H">Current state</text><text x="220" y="1248" class="t B">Web + auth + receipt review + ledger + settlements working</text><text x="220" y="1276" class="t B">Verified Supabase foundation • repeat-purchase rule exists</text><text x="220" y="1304" class="t N">Green means adopted/current—not automatic production acceptance</text>
<text x="765" y="1217" class="t H">Next milestones</text><text x="765" y="1248" class="t B">Sarvam key as Supabase secret • guarded job completion • sanitizer integration</text><text x="765" y="1276" class="t B">Exact parser validation • restock enrichment • iPhone parity / TestFlight pending</text><text x="765" y="1304" class="t N">Advanced predictions wait for quality evidence; maintain reference + changelog</text>
