<title id="title">Grocery Ledger Evolution Map</title><desc id="desc">Tree and timeline showing product intent, adopted architecture, receipt and replenishment evolution, authentication and design choices, dropped alternatives, privacy boundary, current state and milestones.</desc>
<defs><style>
.bg{fill:#fbf7ea}.c{fill:#fffdf7;stroke:#284e41;stroke-width:2}.g{fill:#dcebd9;stroke:#2d6b50;stroke-width:2.4}.a{fill:#ffe1ad;stroke:#9b5918;stroke-width:2.4}.x{fill:#f5d3ca;stroke:#a54432;stroke-width:2.2}.d{fill:#e8e6df;stroke:#68645d;stroke-width:2.2}.r{fill:#f5bf72;stroke:#884b15;stroke-width:2.6}.p{fill:#244b3f}.ln{fill:none;stroke:#45685c;stroke-width:3;stroke-linecap:round}.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#203c33}.T{font-size:38px;font-weight:750}.S{font-size:18px;fill:#50645d}.P{font-size:15px;font-weight:750;fill:#8b4e17;letter-spacing:.8px}.H{font-size:19px;font-weight:750}.B{font-size:14px;font-weight:520}.N{font-size:12.5px;font-weight:550;fill:#455b53}.W{fill:#fffdf7}.L{font-size:13px;font-weight:650}</style><filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#173e32" flood-opacity=".12"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#45685c"/></marker></defs>
<rect width="1600" height="1400" class="bg"/><text x="65" y="62" class="t T">Grocery Ledger Evolution Map</text><text x="67" y="94" class="t S">From first intent to today’s privacy-gated, two-client household ledger.</text>
